<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chéz Gerrard — Week of 1 July</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
    --page-bg: #F7F6F3;
    --card-bg: #FFFFFF;
    --text-primary: #111111;
    --text-secondary: #666666;
    --text-muted: #999999;
    --border: #EBEBEB;
    --accent: #111111;
    --transition: 0.22s ease;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    height: 56px;
  }
  .site-logo {
    font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
  }
  .site-logo span { color: var(--text-muted); font-weight: 400; }
  .site-meta { font-size: 12px; color: var(--text-muted); font-weight: 500; }

  .tab-bar {
    position: sticky; top: 56px; z-index: 99;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    padding: 0 20px;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 20px 10px;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: border-color var(--transition), color var(--transition);
    user-select: none;
  }
  .tab:hover .tab-day { color: var(--text-primary); }
  .tab-day {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--text-muted);
    text-transform: uppercase;
    transition: color var(--transition);
    margin-bottom: 2px;
  }
  .tab-name {
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: color var(--transition);
    max-width: 130px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active .tab-day { color: var(--tab-accent, #111); }
  .tab.active .tab-name { color: var(--tab-accent, #111); font-weight: 600; }
  .tab.active { border-bottom-color: var(--tab-accent, #111); }

  .panel { display: none; }
  .panel.active { display: block; }

  .hero {
    width: 100%; height: 280px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: var(--hero-gradient);
  }
  .hero-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
  }
  .hero-emoji {
    position: absolute; right: 48px; top: 50%;
    transform: translateY(-50%);
    font-size: 120px; opacity: 0.12;
    filter: grayscale(0.2);
    pointer-events: none;
    user-select: none;
  }
  .hero-content {
    position: relative; z-index: 2;
    padding: 0 36px 28px;
  }
  .cuisine-pill {
    display: inline-flex; align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(4px);
    margin-bottom: 10px;
  }
  .hero-title {
    font-size: 32px; font-weight: 800; line-height: 1.15;
    color: #fff; letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .hero-subtitle {
    font-size: 14px; color: rgba(255,255,255,0.75);
    font-style: italic; font-weight: 400;
  }

  .meta-strip {
    background: #fff;
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .meta-strip::-webkit-scrollbar { display: none; }
  .meta-item {
    flex: 1; min-width: 100px;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 16px;
    border-right: 1px solid var(--border);
  }
  .meta-item:last-child { border-right: none; }
  .meta-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 3px;
  }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--text-primary); }

  .content {
    max-width: 1100px; margin: 0 auto;
    padding: 32px 24px 60px;
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto auto;
    gap: 20px;
  }
  @media (max-width: 780px) {
    .content { grid-template-columns: 1fr; padding: 20px 16px 48px; gap: 16px; }
    .hero { height: 220px; }
    .hero-title { font-size: 24px; }
    .hero-emoji { font-size: 80px; right: 20px; }
    .hero-content { padding: 0 20px 20px; }
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .card-header-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-muted);
  }
  .card-header-accent {
    width: 20px; height: 3px; border-radius: 2px;
    background: var(--meal-accent);
    margin-left: auto;
  }

  .ingredients-list { padding: 8px 0; }
  .ingredient-row {
    display: flex; align-items: baseline;
    padding: 8px 20px;
    gap: 12px;
    border-bottom: 1px solid #F4F4F4;
    transition: background var(--transition);
  }
  .ingredient-row:last-child { border-bottom: none; }
  .ingredient-row:hover { background: #FAFAFA; }
  .ing-qty {
    font-size: 12px; font-weight: 700;
    color: var(--text-primary);
    min-width: 62px; flex-shrink: 0;
  }
  .ing-name { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }

  .steps-list { padding: 4px 0; }
  .step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 0 14px;
    padding: 14px 20px;
    border-bottom: 1px solid #F4F4F4;
  }
  .step:last-child { border-bottom: none; }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--meal-accent);
    color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .step-body {}
  .step-head-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .step-heading { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .time-badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
    background: var(--meal-accent-light);
    color: var(--meal-accent);
    white-space: nowrap;
    letter-spacing: 0.2px;
  }
  .step-text {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.65;
  }
  .step-bullets {
    list-style: none;
    padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 7px;
  }
  .step-bullets li {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.55;
    padding-left: 16px;
    position: relative;
  }
  .step-bullets li::before {
    content: '·';
    position: absolute; left: 0;
    color: var(--meal-accent);
    font-weight: 700; font-size: 18px; line-height: 1.0;
  }
  .step-bullets li strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  .tip-card {
    grid-column: 1 / -1;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border-left: 4px solid var(--meal-accent);
    padding: 16px 20px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .tip-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--meal-accent); margin-bottom: 3px; }
  .tip-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  .prep-card {
    grid-column: 1 / -1;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .prep-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: border-color var(--transition);
  }
  .prep-toggle.open { border-bottom-color: var(--border); }
  .prep-toggle-left { display: flex; align-items: center; gap: 10px; }
  .prep-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    background: #F0F0F0; color: var(--text-muted);
    padding: 3px 8px; border-radius: 6px;
    text-transform: uppercase;
  }
  .prep-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .prep-chevron {
    width: 20px; height: 20px; color: var(--text-muted);
    transition: transform var(--transition);
    flex-shrink: 0;
  }
  .prep-chevron.open { transform: rotate(180deg); }
  .prep-body { display: none; padding: 16px 20px; }
  .prep-body.open { display: block; }
  .prep-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 7px 0;
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.55;
    border-bottom: 1px solid #F4F4F4;
  }
  .prep-item:last-child { border-bottom: none; }
  .prep-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--meal-accent); flex-shrink: 0; margin-top: 7px;
  }

  .site-footer {
    text-align: center; padding: 24px;
    font-size: 12px; color: var(--text-muted);
    border-top: 1px solid var(--border);
    background: #fff;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .panel.active { animation: fadeIn 0.2s ease forwards; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo">Chéz Gerrard <span>/ Meal Plan</span></div>
  <div class="site-meta">Week of 1 July 2026</div>
</header>

<nav class="tab-bar" id="tabBar"></nav>
<main id="mainContent"></main>

<script>
const MEALS = [

    gradient: 'linear-gradient(135deg, #0A0200 0%, #2A0800 45%, #6B1800 100%)',

      ['5 min','Marinate the chicken',[
        'Mix <strong>tikka paste + ginger paste + turmeric + kashmiri chilli + garam masala + garlic granules + yogurt + oil</strong> in a bowl.',

      ['15 min','Air fry the chicken',[

      ['15 min (while chicken cooks)','Rice + spinach',[
        'Rinse <strong>300g basmati</strong>, cook in the rice cooker.',

      ['Serve','Plate up',[

    ],
    tip: 'The tikka paste is almost gone after this dish — buy more at the weekend. You can also make a quick marinade from scratch if needed: cumin + coriander + garam masala + kashmiri chilli + yogurt + lemon + garlic. Homemade takes 2 more minutes and is arguably better.',

      'If you have 10 minutes on Tuesday night, marinate the chicken ahead — it makes a real difference to depth of flavour.',
      'Rice cooker goes on when the chicken goes in the air fryer.',
    ],
  },
  {
    day: 'Thursday', shortDay: 'THU', date: '2 Jul',
    name: 'Beef Bolognese',
    subtitle: 'Rigatoni + Rich Beef Ragu + Dressed Green Salad',
    cuisine: 'Italian', serves: '2–3', time: '35 min', method: 'Pan',
    emoji: '🍝',
    gradient: 'linear-gradient(135deg, #020001 0%, #180009 45%, #3D0010 100%)',
    accent: '#9B1B35',
    accentLight: '#FAF0F2',
    ingredients: [
      ['500g','Beef mince'],
      ['1 tin (400g)','Chopped tomatoes'],
      ['2 tbsp','Tomato purée'],
      ['1 tbsp','Worcestershire sauce'],
      ['1 tbsp','Red wine vinegar'],
      ['½ tsp','Chilli flakes'],
      ['1 tsp','Dried oregano'],
      ['½ tsp','Mixed herbs'],
      ['2 tbsp','Olive oil'],
      ['1 bulb','Garlic (4 cloves, minced)'],
      ['1 large','Onion, finely diced'],
      ['— PASTA —',''],
      ['300g','Rigatoni or penne'],
      ['— SALAD —',''],
      ['2 handfuls','Mixed salad leaves'],
      ['1','Lemon, juiced'],
      ['1 tbsp','Extra virgin olive oil'],
    ],
    steps: [
      ['5 min','Build the base',[
        '<strong>2 tbsp olive oil</strong> in the HexClad pan on medium heat.',
        'Add <strong>finely diced onion</strong>. Cook 6–8 min, stirring occasionally, until soft and golden at the edges — do not rush this. This is your flavour base.',
        'Add <strong>4 minced garlic cloves</strong>. Stir 60 sec.',
        'Add <strong>½ tsp chilli flakes</strong>. Stir 30 sec.',
      ]],
      ['8 min','Brown the mince',[
        'Add <strong>500g beef mince</strong>. Turn heat to high.',
        'Do not stir for 2 min — let it sit and develop colour on the bottom. Then break up and stir.',
        'Continue on high heat until all the mince is properly browned with dark edges — no grey, no steaming.',
        'Add <strong>2 tbsp tomato purée</strong>. Stir into the mince and cook 2 min. The purée should deepen in colour slightly.',

      ['15 min','Simmer the sauce',[
        'Pour in <strong>1 tin chopped tomatoes + 1 tbsp Worcestershire sauce + 1 tbsp red wine vinegar</strong>.',
        'Add <strong>1 tsp oregano + ½ tsp mixed herbs</strong>. Season well with salt.',

      ['10 min (while simmering)','Boil the pasta',[
        'Bring a large pan of heavily salted water to a boil.',

      ['Serve','Salad + pasta',[
        'Dress leaves with <strong>1 tbsp EVOO + juice of 1 lemon + pinch of salt</strong>.',

      'Dice the onion in the morning if you want to save time at dinner.',
      'Sauce holds well — make a double batch and refrigerate for next-day lunch.',
    ],
  },
  {
    day: 'Friday', shortDay: 'FRI', date: '3 Jul',
    name: 'Jerk Chicken',
    subtitle: 'Air Fryer Jerk Thighs + Rice & Kidney Beans + Lime Yogurt',
    cuisine: 'Caribbean', serves: '2–3', time: '30 min active', method: 'Air fryer',
    emoji: '🌶️',
    gradient: 'linear-gradient(135deg, #010200 0%, #06200A 45%, #0F4D18 100%)',
    accent: '#1A7A2E',
    accentLight: '#EDF7EF',
    ingredients: [
      ['4–5','Chicken thighs, boneless & skinless'],

      ['1½ tsp','Allspice (ground)'],

    steps: [
      ['Tonight (Thursday) or 30 min ahead','Marinate',[
        'Combine all marinade ingredients in a bowl: <strong>allspice + thyme + cinnamon + chilli powder + chilli flakes + garlic granules + ginger paste + soy + fish sauce + honey + rice vinegar + oil</strong>.',

      ['25 min','Rice & beans',[

      ['18–20 min','Air fry the chicken',[

      ['5 min','Lime yogurt + tomato salad',[

      'Marinate Thursday night for Friday — the longer the better for jerk.',

    ],
  },
  {

// ── Render ──────────────────────────────────────────────────────────────────
const tabBar = document.getElementById('tabBar');
const mainContent = document.getElementById('mainContent');

MEALS.forEach((m, idx) => {
  // Tab
  const tab = document.createElement('div');
  tab.className = 'tab' + (idx === 0 ? ' active' : '');
  tab.style.setProperty('--tab-accent', m.accent);
  tab.innerHTML = `<div class="tab-day">${m.shortDay} ${m.date}</div><div class="tab-name">${m.name}</div>`;
  tab.addEventListener('click', () => switchTo(idx));
  tabBar.appendChild(tab);

  // Panel
  const panel = document.createElement('div');
  panel.className = 'panel' + (idx === 0 ? ' active' : '');
  panel.id = 'panel-' + idx;
  panel.style.setProperty('--hero-gradient', m.gradient);
  panel.style.setProperty('--meal-accent', m.accent);
  panel.style.setProperty('--meal-accent-light', m.accentLight);

  const ingsHtml = m.ingredients.map(([qty, name]) =>
    name === ''
      ? `<div class="ingredient-row" style="background:#F9F9F9;"><span class="ing-qty" style="color:#aaa;font-size:10px;letter-spacing:0.5px;">${qty}</span><span class="ing-name"></span></div>`
      : `<div class="ingredient-row"><span class="ing-qty">${qty}</span><span class="ing-name">${name}</span></div>`
  ).join('');

  const stepsHtml = m.steps.map(([time, heading, bullets], si) => `
    <div class="step">
      <div class="step-num">${si+1}</div>
      <div class="step-body">
        <div class="step-head-row">
          <span class="step-heading">${heading}</span>
          <span class="time-badge">${time}</span>
        </div>
        <ul class="step-bullets">
          ${bullets.map(b => `<li>${b}</li>`).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  const prepHtml = m.prep ? `
    <div class="prep-card">
      <div class="prep-toggle" onclick="togglePrep(this)">
        <div class="prep-toggle-left">
          <span class="prep-tag">Prep</span>

      </div>
      <div class="prep-body">
        ${m.prep.map(p => `<div class="prep-item"><div class="prep-dot"></div><div>${p}</div></div>`).join('')}
      </div>
    </div>
  ` : '';

  panel.innerHTML = `

      <div class="hero-bg"></div>
      <div class="hero-emoji">${m.emoji}</div>
      <div class="hero-content">
        <div class="cuisine-pill">${m.cuisine}</div>

        <div class="hero-subtitle">${m.subtitle}</div>

      <div class="meta-item"><div class="meta-label">Method</div><div class="meta-value">${m.method}</div></div>

  mainContent.appendChild(panel);
});

function switchTo(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function togglePrep(toggle) {
  const body = toggle.nextElementSibling;
  const chevron = toggle.querySelector('.prep-chevron');
  toggle.classList.toggle('open');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}
