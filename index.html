<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chéz Gerrard — Week of 7 September</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
    --page-bg: #F7F6F3;
    --card-bg: #FFFFFF;
    --text-primary: #111111;
    --text-secondary: #666666;
    --text-muted: #999999;
    --border: #EBEBEB;
    --accent: #111111;
    --transition: 0.22s ease;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    height: 56px;
  }
  .site-logo {
    font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
  }
  .site-logo span { color: var(--text-muted); font-weight: 400; }
  .site-meta { font-size: 12px; color: var(--text-muted); font-weight: 500; }

  .tab-bar {
    position: sticky; top: 56px; z-index: 99;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    padding: 0 20px;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 20px 10px;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: border-color var(--transition), color var(--transition);
    user-select: none;
  }
  .tab:hover .tab-day { color: var(--text-primary); }
  .tab-day {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--text-muted);
    text-transform: uppercase;
    transition: color var(--transition);
    margin-bottom: 2px;
  }
  .tab-name {
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: color var(--transition);
    max-width: 130px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active .tab-day { color: var(--tab-accent, #111); }
  .tab.active .tab-name { color: var(--tab-accent, #111); font-weight: 600; }
  .tab.active { border-bottom-color: var(--tab-accent, #111); }

  .panel { display: none; }
  .panel.active { display: block; }

  .hero {
    width: 100%; height: 280px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: var(--hero-gradient);
  }
  .hero-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
  }
  .hero-emoji {
    position: absolute; right: 48px; top: 50%;
    transform: translateY(-50%);
    font-size: 120px; opacity: 0.12;
    filter: grayscale(0.2);
    pointer-events: none;
    user-select: none;
  }
  .hero-content {
    position: relative; z-index: 2;
    padding: 0 36px 28px;
  }
  .cuisine-pill {
    display: inline-flex; align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(4px);
    margin-bottom: 10px;
  }
  .hero-title {
    font-size: 32px; font-weight: 800; line-height: 1.15;
    color: #fff; letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .hero-subtitle {
    font-size: 14px; color: rgba(255,255,255,0.75);
    font-style: italic; font-weight: 400;
  }

  .meta-strip {
    background: #fff;
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .meta-strip::-webkit-scrollbar { display: none; }
  .meta-item {
    flex: 1; min-width: 100px;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 16px;
    border-right: 1px solid var(--border);
  }
  .meta-item:last-child { border-right: none; }
  .meta-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 3px;
  }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--text-primary); }

  .content {
    max-width: 1100px; margin: 0 auto;
    padding: 32px 24px 60px;
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto auto;
    gap: 20px;
  }
  @media (max-width: 780px) {
    .content { grid-template-columns: 1fr; padding: 20px 16px 48px; gap: 16px; }
    .hero { height: 220px; }
    .hero-title { font-size: 24px; }
    .hero-emoji { font-size: 80px; right: 20px; }
    .hero-content { padding: 0 20px 20px; }
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .card-header-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-muted);
  }
  .card-header-accent {
    width: 20px; height: 3px; border-radius: 2px;
    background: var(--meal-accent);
    margin-left: auto;
  }

  .ingredients-list { padding: 8px 0; }
  .ingredient-row {
    display: flex; align-items: baseline;
    padding: 8px 20px;
    gap: 12px;
    border-bottom: 1px solid #F4F4F4;
    transition: background var(--transition);
  }
  .ingredient-row:last-child { border-bottom: none; }
  .ingredient-row:hover { background: #FAFAFA; }
  .ing-qty {
    font-size: 12px; font-weight: 700;
    color: var(--text-primary);
    min-width: 62px; flex-shrink: 0;
  }
  .ing-name { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }

  .steps-list { padding: 4px 0; }
  .step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 0 14px;
    padding: 14px 20px;
    border-bottom: 1px solid #F4F4F4;
  }
  .step:last-child { border-bottom: none; }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--meal-accent);
    color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .step-body {}
  .step-head-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .step-heading { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .time-badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
    background: var(--meal-accent-light);
    color: var(--meal-accent);
    white-space: nowrap;
    letter-spacing: 0.2px;
  }
  .step-text {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.65;
  }
  .step-bullets {
    list-style: none;
    padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 7px;
  }
  .step-bullets li {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.55;
    padding-left: 16px;
    position: relative;
  }
  .step-bullets li::before {
    content: '·';
    position: absolute; left: 0;
    color: var(--meal-accent);
    font-weight: 700; font-size: 18px; line-height: 1.0;
  }
  .step-bullets li strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  .tip-card {
    grid-column: 1 / -1;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border-left: 4px solid var(--meal-accent);
    padding: 16px 20px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .tip-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--meal-accent); margin-bottom: 3px; }
  .tip-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  .prep-card {
    grid-column: 1 / -1;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .prep-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: border-color var(--transition);
  }
  .prep-toggle.open { border-bottom-color: var(--border); }
  .prep-toggle-left { display: flex; align-items: center; gap: 10px; }
  .prep-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    background: #F0F0F0; color: var(--text-muted);
    padding: 3px 8px; border-radius: 6px;
    text-transform: uppercase;
  }
  .prep-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .prep-chevron {
    width: 20px; height: 20px; color: var(--text-muted);
    transition: transform var(--transition);
    flex-shrink: 0;
  }
  .prep-chevron.open { transform: rotate(180deg); }
  .prep-body { display: none; padding: 16px 20px; }
  .prep-body.open { display: block; }
  .prep-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 7px 0;
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.55;
    border-bottom: 1px solid #F4F4F4;
  }
  .prep-item:last-child { border-bottom: none; }
  .prep-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--meal-accent); flex-shrink: 0; margin-top: 7px;
  }

  .site-footer {
    text-align: center; padding: 24px;
    font-size: 12px; color: var(--text-muted);
    border-top: 1px solid var(--border);
    background: #fff;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .panel.active { animation: fadeIn 0.2s ease forwards; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo">Chéz Gerrard <span>/ Meal Plan</span></div>
  <div class="site-meta">Mon 7 – Sun 13 September 2026</div>
</header>

<nav class="tab-bar" id="tabBar"></nav>
<main id="mainContent"></main>

<footer class="site-footer">
  Chéz Gerrard &nbsp;·&nbsp; 6 dinners, one shop, one batch cook &nbsp;·&nbsp; Sat 12 — takeaway 🍜

<script>
const MEALS = [
  {
    day: 'Monday', shortDay: 'MON', date: '7 Sep',
    name: 'Honey Sriracha Prawn Fried Rice',
    subtitle: 'Sesame Cucumber Salad & Charred Pak Choi',
    cuisine: 'Asian', serves: '2–3', time: '25 min', method: 'Wok',
    emoji: '🍤',
    gradient: 'linear-gradient(135deg, #00060A 0%, #002430 45%, #005266 100%)',
    accent: '#0E7C8C',
    accentLight: '#E8F5F7',
    ingredients: [
      ['300g','Raw king prawns, peeled'],
      ['250g','Basmati rice (cooked and fully cooled)'],
      ['3','Eggs, beaten'],
      ['100g','Frozen peas'],
      ['3 tbsp','Sriracha'],
      ['2 tbsp','Honey'],
      ['4 tbsp','Light soy sauce (3 for the sauce, 1 for the rice)'],
      ['2 tbsp','Rice vinegar (1 sauce, 1 salad)'],
      ['3 tsp','Sesame oil'],
      ['2 tbsp','Vegetable oil'],
      ['1 tbsp','Ginger paste'],
      ['4 cloves','Garlic, finely chopped'],
      ['4','Spring onions, sliced — whites and greens kept apart'],
      ['2 heads','Pak choi, halved lengthways'],
      ['1','Cucumber, halved, deseeded, sliced'],
      ['1','Lime, cut into wedges'],
      ['','Sea salt, black pepper, pinch of sugar'],
    ],
    steps: [
      ['Ahead','Cook and cool the rice',[
        'Cook <strong>250g basmati rice</strong> in the rice cooker. Spread it on a tray and cool at least 20 min — better still, cook it tonight and fridge it. Warm rice steams instead of frying.',
      ]],
      ['2 min','Mix the sauce',[
        'Whisk <strong>3 tbsp sriracha + 2 tbsp honey + 3 tbsp light soy sauce + 1 tbsp rice vinegar</strong> in a small bowl. Set it by the hob.',
      ]],
      ['3 min','Cucumber salad',[
        'Toss the <strong>sliced cucumber</strong> with <strong>1 tbsp rice vinegar + 1 tsp sesame oil</strong>, a pinch of salt and a pinch of sugar. Fridge until serving.',
      ]],
      ['4 min','Char the pak choi',[
        'Wok on high with <strong>1 tsp sesame oil</strong>. Lay the <strong>2 halved pak choi</strong> cut-side down and leave 2 min without moving them until properly charred.',
        'Splash in <strong>2 tbsp water</strong>, cover 1 min to steam the stems, season with a pinch of salt and set aside.',
      ]],
      ['3 min','Fry the prawns',[
        'Wipe the wok. <strong>1 tbsp vegetable oil</strong>, get it smoking. Pat the <strong>300g prawns</strong> bone dry, lay them in a single layer and leave 90 sec untouched.',
        'Flip, 60 sec more until pink at the edges, then lift them out. They finish in the toss at the end.',
      ]],
      ['6 min','Fried rice',[
        '<strong>1 tbsp vegetable oil</strong> on high. Pour in <strong>3 beaten eggs</strong>, scramble hard 30 sec, tip out.',
        'Add <strong>4 cloves chopped garlic + 1 tbsp ginger paste + the spring onion whites</strong>, 20 sec.',
        'Add the <strong>250g cooled rice</strong>, press it flat against the wok and leave 30 sec at a time so it catches. Fry 3 min.',
        'Stir through <strong>100g frozen peas + 1 tbsp light soy sauce + 1 tsp sesame oil</strong>.',
      ]],
      ['2 min','Bring it together',[
        'Return the <strong>prawns and egg</strong>, pour the sauce round the edge of the wok and toss hard for 60 sec until everything is glossy and coated.',
        'Off the heat, scatter the <strong>spring onion greens</strong>. Taste — a splash more soy if it is flat, a squeeze of lime if it is too sweet.',
      ]],
      ['Serve','Plate up',[
        'Fried rice in warm bowls, pak choi alongside, cucumber salad on the side, lime wedges to squeeze over.',
      ]],
    ],
    tip: 'Dry prawns and a screaming-hot wok, every time — wet prawns steam and go rubbery. Three tablespoons of sriracha puts this at a comfortable medium; drop to two if Oli finds it warm.',
    prep: [
      'Cook the rice tonight if you can — day-old rice fries far better.',
      'Prawns are deliberately on day one. They are the one thing this week that will not keep.',
    ],
  },
  {
    day: 'Tuesday', shortDay: 'TUE', date: '8 Sep',
    name: 'Chicken Shish Thighs',
    subtitle: 'Sumac Onions, Flatbreads, Garlic Yogurt & Herb Salad',
    cuisine: 'Middle Eastern', serves: '2–3', time: '25 min (+ marinade)', method: 'Air fryer',
    emoji: '🔥',
    gradient: 'linear-gradient(135deg, #0A0400 0%, #3A1B00 45%, #8A4A00 100%)',
    accent: '#B45309',
    accentLight: '#FDF1E3',
    ingredients: [
      ['600g','Chicken thighs, boneless & skinless, halved'],
      ['4 tbsp','Greek yogurt (marinade)'],
      ['200g','Greek yogurt (garlic yogurt)'],
      ['2 tbsp','Olive oil'],
      ['5 cloves','Garlic, crushed (4 marinade, 1 yogurt)'],
      ['2 tbsp','Sumac (1 marinade, 1 onions)'],
      ['2 tsp','Paprika (smoked)'],
      ['1 tsp','Cumin (ground)'],
      ['2 tsp','Oregano (dried)'],
      ['1 tsp','Chilli flakes'],
      ['2','Lemons'],
      ['2','Red onions, sliced as finely as you can'],
      ['6','Flatbreads'],
      ['1 bag','Babyleaf salad'],
      ['','Flat-leaf parsley and mint, roughly chopped'],
      ['200g','Cherry tomatoes, halved'],
      ['1','Cucumber, diced'],
      ['2 tbsp','Extra virgin olive oil (salad)'],
      ['','Sea salt, black pepper'],
    ],
    steps: [
      ['1 hr+','Marinate the chicken',[
        'Halve the <strong>600g chicken thighs</strong> so they cook evenly.',
        'Mix <strong>4 tbsp Greek yogurt + 2 tbsp olive oil + 4 cloves crushed garlic + 1 tbsp sumac + 2 tsp smoked paprika + 1 tsp ground cumin + 2 tsp dried oregano + 1 tsp chilli flakes + 1 tsp sea salt + 1 tsp black pepper + the juice of ½ lemon</strong>.',
        'Turn the chicken through it. One hour minimum, four is better — get it on before work.',
      ]],
      ['5 min','Sumac onions',[
        'Toss the <strong>2 finely sliced red onions</strong> with <strong>1 tbsp sumac + ½ tsp sea salt + the juice of ½ lemon</strong> and a good handful of chopped parsley.',
        'Scrunch it with your hands and leave 20 min — the salt and acid take the raw edge off completely.',
      ]],
      ['2 min','Garlic yogurt',[
        'Stir <strong>200g Greek yogurt + 1 clove crushed garlic + a squeeze of lemon + a pinch of salt</strong>. Loosen with a splash of water if it is too stiff to spoon.',
      ]],
      ['18 min','Air fry',[
        'Air fryer to <strong>200°C</strong>. Chicken in a single layer — two batches rather than crowding it, crowding is what stops it charring.',
        '<strong>15–18 min</strong>, flipping at the 8 min mark. You want blackened edges, not an even golden colour.',
      ]],
      ['4 min','Salad and breads',[
        'Toss the <strong>babyleaf + 200g halved cherry tomatoes + diced cucumber + chopped parsley and mint</strong> with <strong>2 tbsp extra virgin olive oil + the juice of ½ lemon</strong>, salt and pepper.',
        'Warm the <strong>6 flatbreads</strong> in the air fryer, 60 sec at 180°C, while the chicken rests.',
      ]],
      ['Serve','Build it',[
        'Flatbread, garlic yogurt, chicken, a big pile of sumac onions, salad alongside. Remaining lemon in wedges.',
      ]],
    ],
    tip: 'The yogurt marinade does two jobs — it tenderises, and its sugars are what give you char at 200°C without the thighs drying out. Sumac is the flavour here: sharp and fruity rather than hot, so it will not read as spicy to Oli.',
    prep: [
      'Get the marinade on in the morning.',
      'Sumac onions can be done an hour ahead and only improve sitting in the fridge.',
    ],
  },
  {
    day: 'Wednesday', shortDay: 'WED', date: '9 Sep',
    name: 'Proper Beef Bolognese',
    subtitle: 'Double Batch · Rigatoni, Parmesan & Dressed Green Salad',
    cuisine: 'Italian', serves: '6 (3 tonight + 3 Friday)', time: '20 min active + 50 min simmer', method: 'Pan',
    emoji: '🍝',
    gradient: 'linear-gradient(135deg, #0A0002 0%, #38000C 45%, #7E1226 100%)',
    accent: '#9B1C31',
    accentLight: '#FBEAEE',
    ingredients: [
      ['750g','Beef mince (5%)'],
      ['100g','Pancetta or smoked lardons'],
      ['2','Onions, finely diced'],
      ['3','Carrots, finely diced'],
      ['3 sticks','Celery, finely diced'],
      ['5 cloves','Garlic, crushed'],
      ['3 tbsp','Olive oil'],
      ['4 tbsp','Tomato purée'],
      ['2 tins (800g)','Chopped tomatoes'],
      ['250ml','Red wine'],
      ['500ml','Beef stock'],
      ['150ml','Whole milk'],
      ['2','Bay leaves'],
      ['1 tbsp','Balsamic vinegar'],
      ['2 tsp','Sea salt'],
      ['1 tsp','Black pepper'],
      ['250g','Rigatoni (tonight only)'],
      ['','Parmesan, grated'],
      ['1 bag','Babyleaf salad'],
      ['','Extra virgin olive oil and balsamic, to dress'],
    ],
    steps: [
      ['10 min','Soffritto',[
        'Big heavy pan, <strong>2 tbsp olive oil</strong>, medium heat. <strong>100g pancetta</strong> for 4 min until the fat has rendered out.',
        'Add <strong>2 diced onions + 3 diced carrots + 3 diced celery sticks</strong> and a pinch of salt. <strong>8 min</strong> until genuinely soft and sweet — you are not browning it, you are melting it down.',
        'Add <strong>5 cloves crushed garlic</strong>, 45 sec. Tip the lot into a bowl.',
      ]],
      ['8 min','Brown the mince — in two halves',[
        'Same pan on high, <strong>1 tbsp olive oil</strong>. Add <strong>375g of the mince</strong>, half only, and leave it alone 3–4 min before you break it up.',
        'Tip it out and repeat with the <strong>remaining 375g</strong>. Filling the pan in one go is what gives you grey, boiled mince.',
      ]],
      ['5 min','Purée and wine',[
        'Return everything to the pan. Add <strong>4 tbsp tomato purée</strong> and fry it a full 2 min until it darkens to brick red — this is where the depth comes from.',
        'Pour in <strong>250ml red wine</strong>, scrape the base clean and reduce almost to nothing, 3 min.',
      ]],
      ['40 min','Simmer',[
        'Add <strong>2 tins chopped tomatoes + 500ml beef stock + 2 bay leaves + 2 tsp sea salt + 1 tsp black pepper</strong>.',
        'Bring to a bare simmer, lid slightly ajar, <strong>40 min</strong>. Stir every 10 min or so.',
      ]],
      ['10 min','Milk and finish',[
        'Stir in <strong>150ml whole milk</strong> and simmer uncovered a further 10 min until thick and glossy and a spoon leaves a trail.',
        'Off the heat, stir in <strong>1 tbsp balsamic vinegar</strong>. Taste it properly — if it reads flat it wants salt, not more herbs.',
      ]],
      ['Serve','Pasta and salad',[
        'Cook <strong>250g rigatoni</strong> 1 min under the packet time. Save <strong>100ml pasta water</strong>, drain, then toss the pasta into half the sauce with a splash of that water and a handful of <strong>Parmesan</strong>.',

      ]],
    ],
    tip: 'The milk is not optional — it rounds off the acidity of two tins of tomatoes and is the difference between this and a flat spag bol. Deliberately mild so Friday works for Oli before sport; chilli oil or fresh chilli at the table for your portion.',
    prep: [
      'This is the batch cook. Half straight into the fridge — it genuinely tastes better on day two, which is what makes Friday work.',
      'Dice the soffritto small and even. It is the one bit of knife work that changes the result.',
    ],
  },
  {
    day: 'Thursday', shortDay: 'THU', date: '10 Sep',
    name: 'KFC-style Crispy Chicken Thighs',
    subtitle: 'Air-Fryer Chips & Carrot Slaw · Cook with Oli',
    cuisine: 'American', serves: '3', time: '35 min (+ buttermilk soak)', method: 'Air fryer',
    emoji: '🍗',
    gradient: 'linear-gradient(135deg, #0A0700 0%, #3A2A00 45%, #8A6300 100%)',
    accent: '#C08000',
    accentLight: '#FDF4E0',
    ingredients: [

const tabBar = document.getElementById('tabBar');
const mainContent = document.getElementById('mainContent');

MEALS.forEach((m, idx) => {
  // Tab
  const tab = document.createElement('div');
  tab.className = 'tab' + (idx === 0 ? ' active' : '');
  tab.style.setProperty('--tab-accent', m.accent);
  tab.innerHTML = `<div class="tab-day">${m.shortDay} ${m.date}</div><div class="tab-name">${m.name}</div>`;
  tab.addEventListener('click', () => switchTo(idx));
  tabBar.appendChild(tab);

  // Panel
  const panel = document.createElement('div');
  panel.className = 'panel' + (idx === 0 ? ' active' : '');
  panel.id = 'panel-' + idx;
  panel.style.setProperty('--hero-gradient', m.gradient);
  panel.style.setProperty('--meal-accent', m.accent);
  panel.style.setProperty('--meal-accent-light', m.accentLight);

  const ingsHtml = m.ingredients.map(([qty, name]) =>
    name === ''
      ? `<div class="ingredient-row" style="background:#F9F9F9;"><span class="ing-qty" style="color:#aaa;font-size:10px;letter-spacing:0.5px;">${qty}</span><span class="ing-name"></span></div>`
      : `<div class="ingredient-row"><span class="ing-qty">${qty}</span><span class="ing-name">${name}</span></div>`
  ).join('');

  const stepsHtml = m.steps.map(([time, heading, bullets], si) => `
    <div class="step">
      <div class="step-num">${si+1}</div>
      <div class="step-body">
        <div class="step-head-row">
          <span class="step-heading">${heading}</span>
          <span class="time-badge">${time}</span>
        </div>
        <ul class="step-bullets">
          ${bullets.map(b => `<li>${b}</li>`).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  const prepHtml = m.prep && m.prep.length ? `
    <div class="prep-card">
      <div class="prep-toggle" onclick="togglePrep(this)">
        <div class="prep-toggle-left">
          <span class="prep-tag">Prep</span>

function switchTo(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function togglePrep(toggle) {
  const body = toggle.nextElementSibling;
  const chevron = toggle.querySelector('.prep-chevron');
  toggle.classList.toggle('open');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}
