<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .tab-bar {
    position: sticky; top: 56px; z-index: 99;
    background: #fff;
    border-bottom: 1px solid var(--border);

    scrollbar-width: none; -ms-overflow-style: none;
    padding: 0 20px;
  }

  .tab {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;

    cursor: pointer;
    border-bottom: 2.5px solid transparent;

    user-select: none;

  .tab-day { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: var(--text-muted); text-transform: uppercase; transition: color var(--transition); margin-bottom: 2px; }

  .hero-content { position: relative; z-index: 2; padding: 0 36px 28px; }
  .cuisine-pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #fff; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(4px); margin-bottom: 10px; }

  .step-body {}

  .step-bullets li::before { content: '·'; position: absolute; left: 0; color: var(--meal-accent); font-weight: 700; font-size: 18px; line-height: 1.0; }
  .step-bullets li strong { color: var(--text-primary); font-weight: 600; }
  .tip-card { grid-column: 1 / -1; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); border-left: 4px solid var(--meal-accent); padding: 16px 20px; display: flex; gap: 12px; align-items: flex-start; }
  .tip-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--meal-accent); margin-bottom: 3px; }

  .prep-card { grid-column: 1 / -1; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
  .prep-toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; transition: border-color var(--transition); }
  .prep-toggle.open { border-bottom-color: var(--border); }
  .prep-toggle-left { display: flex; align-items: center; gap: 10px; }
  .prep-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; background: #F0F0F0; color: var(--text-muted); padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

  .simple-night-title { font-size: 26px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
  .simple-night-sub { font-size: 15px; color: var(--text-secondary); line-height: 1.6; }
  .site-footer { text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); background: #fff; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .panel.active { animation: fadeIn 0.2s ease forwards; }
</style>
</head>

// ── Rendering ─────────────────────────────────────────────────────────────
const tabBar = document.getElementById('tabBar');
const mainContent = document.getElementById('mainContent');

function renderIngredientSection(label, items) {
  const isHeader = label === '';
  if (isHeader) {
    return `<div class="ingredient-row" style="background:#FAFAFA;padding:6px 20px;">
      <span class="ing-name" style="font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-muted);">${items}</span>
    </div>`;
  }
  return `<div class="ingredient-row">
    <span class="ing-qty">${label}</span>
    <span class="ing-name">${items}</span>
  </div>`;
}

MEALS.forEach((meal, index) => {
  // Tab
  const tab = document.createElement('div');
  tab.className = 'tab' + (index === 0 ? ' active' : '');
  tab.style.setProperty('--tab-accent', meal.accent);
  tab.innerHTML = `<span class="tab-day">${meal.shortDay} ${meal.date}</span><span class="tab-name">${meal.name}</span>`;
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + index).classList.add('active');
  });
  tabBar.appendChild(tab);

  // Panel
  const panel = document.createElement('div');
  panel.className = 'panel' + (index === 0 ? ' active' : '');
  panel.id = 'panel-' + index;
  panel.style.setProperty('--meal-accent', meal.accent);
  panel.style.setProperty('--meal-accent-light', meal.accentLight);
  panel.style.setProperty('--hero-gradient', meal.gradient);

  if (meal.isSimpleNight) {
    panel.innerHTML = `
      <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-emoji">${meal.emoji}</div>
        <div class="hero-content">
          <div class="cuisine-pill">${meal.date}</div>
          <div class="hero-title">${meal.name}</div>
          <div class="hero-subtitle">${meal.subtitle}</div>
        </div>
      </div>
      <div class="simple-night">
        <div class="simple-night-icon">${meal.emoji}</div>
        <div class="simple-night-title">${meal.name}</div>
        <div class="simple-night-sub">${meal.simpleMessage}</div>
      </div>`;
  } else {
    const ingredientRows = meal.ingredients.map(([qty, name]) => {
      if (qty.startsWith('—')) {
        return `<div class="ingredient-row" style="background:#FAFAFA;padding:6px 20px;">
          <span class="ing-name" style="font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-muted);">${qty}</span>
        </div>`;
      }
      return `<div class="ingredient-row">
        <span class="ing-qty">${qty}</span>
        <span class="ing-name">${name}</span>
      </div>`;
    }).join('');

    const stepRows = meal.steps.map(([time, heading, bullets], i) => {
      const bulletItems = bullets.map(b => `<li>${b}</li>`).join('');
      const isServe = time === 'Serve';
      return `<div class="step">
        <div class="step-num">${isServe ? '✓' : (i + 1)}</div>
        <div class="step-body">
          <div class="step-head-row">
            <span class="step-heading">${heading}</span>
            ${!isServe ? `<span class="time-badge">${time}</span>` : ''}
          </div>
          <ul class="step-bullets">${bulletItems}</ul>
        </div>
      </div>`;
    }).join('');

    const prepItems = meal.sundayPrep.map(p => `
      <div class="prep-item"><div class="prep-dot"></div><span>${p}</span></div>`).join('');

    panel.innerHTML = `
      <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-emoji">${meal.emoji}</div>
        <div class="hero-content">
          <div class="cuisine-pill">${meal.cuisine}</div>
          <div class="hero-title">${meal.name}</div>
          <div class="hero-subtitle">${meal.subtitle}</div>
        </div>
      </div>
      <div class="meta-strip">
        <div class="meta-item"><span class="meta-label">Serves</span><span class="meta-value">${meal.serves}</span></div>
        <div class="meta-item"><span class="meta-label">Time</span><span class="meta-value">${meal.time}</span></div>
        <div class="meta-item"><span class="meta-label">Method</span><span class="meta-value">${meal.method}</span></div>
        <div class="meta-item"><span class="meta-label">Cuisine</span><span class="meta-value">${meal.cuisine}</span></div>
      </div>
      <div class="content">
        <div class="card">
          <div class="card-header"><span class="card-header-title">Ingredients</span><div class="card-header-accent"></div></div>
          <div class="ingredients-list">${ingredientRows}</div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-header-title">Method</span><div class="card-header-accent"></div></div>
          <div class="steps-list">${stepRows}</div>
        </div>
        ${meal.tip ? `<div class="tip-card">
          <div class="tip-icon">💡</div>
          <div><div class="tip-label">Chef's Note</div><div class="tip-text">${meal.tip}</div></div>
        </div>` : ''}
        ${prepItems ? `<div class="prep-card">
          <div class="prep-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open');this.querySelector('.prep-chevron').classList.toggle('open');">
            <div class="prep-toggle-left"><span class="prep-tag">Prep tips</span><span class="prep-title">Make-ahead & notes</span></div>
            <svg class="prep-chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
          </div>
          <div class="prep-body">${prepItems}</div>
        </div>` : ''}
      </div>`;
  }
  mainContent.appendChild(panel);
});
</script>
