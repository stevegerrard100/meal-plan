<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chéz Gerrard — Week of 20 August</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
    --page-bg: #F7F6F3;
    --card-bg: #FFFFFF;
    --text-primary: #111111;
    --text-secondary: #666666;
    --text-muted: #999999;
    --border: #EBEBEB;
    --accent: #111111;
    --transition: 0.22s ease;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    height: 56px;
  }
  .site-logo {
    font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
  }
  .site-logo span { color: var(--text-muted); font-weight: 400; }
  .site-meta { font-size: 12px; color: var(--text-muted); font-weight: 500; }

  .tab-bar {
    position: sticky; top: 56px; z-index: 99;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    padding: 0 20px;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 20px 10px;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: border-color var(--transition), color var(--transition);
    user-select: none;
  }
  .tab:hover .tab-day { color: var(--text-primary); }
  .tab-day {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--text-muted);
    text-transform: uppercase;
    transition: color var(--transition);
    margin-bottom: 2px;
  }
  .tab-name {
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: color var(--transition);
    max-width: 130px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active .tab-day { color: var(--tab-accent, #111); }
  .tab.active .tab-name { color: var(--tab-accent, #111); font-weight: 600; }
  .tab.active { border-bottom-color: var(--tab-accent, #111); }

  .panel { display: none; }
  .panel.active { display: block; }

  .hero {
    width: 100%; height: 280px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: var(--hero-gradient);
  }
  .hero-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
  }
  .hero-emoji {
    position: absolute; right: 48px; top: 50%;
    transform: translateY(-50%);
    font-size: 120px; opacity: 0.12;
    filter: grayscale(0.2);
    pointer-events: none;
    user-select: none;
  }
  .hero-content {
    position: relative; z-index: 2;
    padding: 0 36px 28px;
  }
  .cuisine-pill {
    display: inline-flex; align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(4px);
    margin-bottom: 10px;
  }
  .hero-title {
    font-size: 32px; font-weight: 800; line-height: 1.15;
    color: #fff; letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .hero-subtitle {
    font-size: 14px; color: rgba(255,255,255,0.75);
    font-style: italic; font-weight: 400;
  }

  .meta-strip {
    background: #fff;
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .meta-strip::-webkit-scrollbar { display: none; }
  .meta-item {
    flex: 1; min-width: 100px;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 16px;
    border-right: 1px solid var(--border);
  }
  .meta-item:last-child { border-right: none; }
  .meta-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 3px;
  }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--text-primary); }

  .content {
    max-width: 1100px; margin: 0 auto;
    padding: 32px 24px 60px;
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto auto;
    gap: 20px;
  }
  @media (max-width: 780px) {
    .content { grid-template-columns: 1fr; padding: 20px 16px 48px; gap: 16px; }
    .hero { height: 220px; }
    .hero-title { font-size: 24px; }
    .hero-emoji { font-size: 80px; right: 20px; }
    .hero-content { padding: 0 20px 20px; }
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .card-header-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-muted);
  }
  .card-header-accent {
    width: 20px; height: 3px; border-radius: 2px;
    background: var(--meal-accent);
    margin-left: auto;
  }

  .ingredients-list { padding: 8px 0; }
  .ingredient-row {
    display: flex; align-items: baseline;
    padding: 8px 20px;
    gap: 12px;
    border-bottom: 1px solid #F4F4F4;
    transition: background var(--transition);
  }
  .ingredient-row:last-child { border-bottom: none; }
  .ingredient-row:hover { background: #FAFAFA; }
  .ing-qty {
    font-size: 12px; font-weight: 700;
    color: var(--text-primary);
    min-width: 62px; flex-shrink: 0;
  }
  .ing-name { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }

  .steps-list { padding: 4px 0; }
  .step {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 0 14px;
    padding: 14px 20px;
    border-bottom: 1px solid #F4F4F4;
  }
  .step:last-child { border-bottom: none; }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--meal-accent);
    color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .step-body {}
  .step-head-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .step-heading { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .time-badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
    background: var(--meal-accent-light);
    color: var(--meal-accent);
    white-space: nowrap;
    letter-spacing: 0.2px;
  }
  .step-text {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.65;
  }
  .step-bullets {
    list-style: none;
    padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 7px;
  }
  .step-bullets li {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.55;
    padding-left: 16px;
    position: relative;
  }
  .step-bullets li::before {
    content: '·';
    position: absolute; left: 0;
    color: var(--meal-accent);
    font-weight: 700; font-size: 18px; line-height: 1.0;
  }
  .step-bullets li strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  .tip-card {
    grid-column: 1 / -1;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border-left: 4px solid var(--meal-accent);
    padding: 16px 20px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .tip-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--meal-accent); margin-bottom: 3px; }
  .tip-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  .prep-card {
    grid-column: 1 / -1;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .prep-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: border-color var(--transition);
  }
  .prep-toggle.open { border-bottom-color: var(--border); }
  .prep-toggle-left { display: flex; align-items: center; gap: 10px; }
  .prep-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    background: #F0F0F0; color: var(--text-muted);
    padding: 3px 8px; border-radius: 6px;
    text-transform: uppercase;
  }
  .prep-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .prep-chevron {
    width: 20px; height: 20px; color: var(--text-muted);
    transition: transform var(--transition);
    flex-shrink: 0;
  }
  .prep-chevron.open { transform: rotate(180deg); }
  .prep-body { display: none; padding: 16px 20px; }
  .prep-body.open { display: block; }
  .prep-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 7px 0;
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.55;
    border-bottom: 1px solid #F4F4F4;
  }
  .prep-item:last-child { border-bottom: none; }
  .prep-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--meal-accent); flex-shrink: 0; margin-top: 7px;
  }

  .site-footer {
    text-align: center; padding: 24px;
    font-size: 12px; color: var(--text-muted);
    border-top: 1px solid var(--border);
    background: #fff;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .panel.active { animation: fadeIn 0.2s ease forwards; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo">Chéz Gerrard <span>/ Meal Plan</span></div>

<main id="mainContent"></main>

<script>
const MEALS = [
  {
    day: 'Thursday', shortDay: 'THU', date: '20 Aug',
    name: 'Salt & Pepper Prawns',
    subtitle: 'Garlic Egg Fried Rice & Charred Pak Choi',
    cuisine: 'Chinese', serves: '2–3', time: '25 min', method: 'Wok',
    emoji: '🍤',
    gradient: 'linear-gradient(135deg, #00060A 0%, #002430 45%, #005266 100%)',
    accent: '#0E7C8C',
    accentLight: '#E8F5F7',
    ingredients: [
      ['450g','Raw king prawns, peeled'],
      ['3 tbsp','Cornflour'],
      ['1 tsp','Sea salt (for the dust)'],
      ['2 tsp','White pepper, ground (black pepper works)'],
      ['1 tsp','Chilli flakes'],
      ['3 tbsp','Vegetable oil'],
      ['250g','Basmati rice (cooked and fully cooled)'],
      ['3','Eggs, beaten'],
      ['4','Spring onions, sliced — whites and greens kept apart'],
      ['4 cloves','Garlic, finely chopped'],
      ['1 tbsp','Ginger paste'],
      ['2','Red chillies, sliced (use 1 for milder)'],
      ['2 tbsp','Light soy sauce'],
      ['2 tsp','Sesame oil'],
      ['3 heads','Pak choi, halved lengthways'],
      ['','Salt, to season'],
    ],
    steps: [
      ['Ahead','Cook and cool the rice',[
        'Cook <strong>250g basmati rice</strong> in the rice cooker. Spread it on a tray and cool at least 20 min — ideally cook it the night before and fridge it. Warm rice steams instead of frying and you get clumps.',
      ]],
      ['2 min','Make the salt and pepper dust',[
        'Mix <strong>3 tbsp cornflour + 1 tsp sea salt + 2 tsp ground white pepper + 1 tsp chilli flakes</strong> in a bowl.',
        'Pat the <strong>450g prawns</strong> completely dry with kitchen paper, then toss them through the dust until evenly coated.',
      ]],
      ['5 min','Fried rice first',[
        'Wok on high with <strong>1 tbsp vegetable oil</strong>. Pour in <strong>3 beaten eggs</strong>, scramble hard for 30 sec, tip out and set aside.',

        'Add the <strong>250g cooled cooked rice</strong>, press it against the wok and leave 30 sec at a time so it catches. Fry 3 min.',
        'Return the egg, add <strong>2 tbsp light soy sauce + 1 tsp sesame oil</strong>, toss through. Tip into a warm bowl and wipe the wok.',
      ]],
      ['4 min','Pak choi',[
        'Same wok, high heat, <strong>1 tsp sesame oil</strong>. Lay the <strong>3 halved pak choi</strong> cut-side down and leave 2 min until properly charred.',
        'Splash in <strong>2 tbsp water</strong>, cover 1 min to steam the stems, then season with a pinch of salt and set aside.',
      ]],
      ['4 min','Fry the prawns',[
        'Wipe the wok, get it smoking with <strong>1 tbsp vegetable oil</strong>. Add the coated prawns in a single layer and leave them 90 sec without touching — that is where the crust comes from.',
        'Flip and fry another 60–90 sec until pink and crisp at the edges. Do it in two batches if the wok looks crowded.',
      ]],
      ['1 min','Aromatics and toss',[
        'Push the prawns to one side. Add <strong>the remaining 2 cloves chopped garlic + 1 tbsp ginger paste + 2 sliced red chillies</strong> to the space, 20 sec until fragrant.',
        'Toss everything together with the <strong>spring onion greens</strong>. Taste and add a final pinch of salt.',
      ]],
      ['Serve','Plate up',[
        'Fried rice in the bowls, prawns piled on top, pak choi alongside.',
      ]],
    ],
    tip: 'The whole point of this dish is dry prawns and a screaming-hot wok. If the prawns release water they will steam and go soft — dry them properly and do not crowd the pan. Two chillies puts this at solid medium; drop to one if you want it gentler.',
    prep: [
      'Cook the rice tonight for tomorrow if you can — day-old rice fries far better.',
      'Prawns are cooked on delivery day deliberately. They are the one thing in this week that does not keep.',
    ],
  },
  {
    day: 'Saturday', shortDay: 'SAT', date: '22 Aug',
    name: 'Beef Chilli con Carne',
    subtitle: 'Double Batch · Rice, Avocado & Lime Salad, Soured Cream',
    cuisine: 'Mexican', serves: '6 (3 tonight + 3 Monday)', time: '20 min active + 45 min simmer', method: 'Pan',
    emoji: '🌶️',
    gradient: 'linear-gradient(135deg, #0A0200 0%, #310800 45%, #7A1B00 100%)',
    accent: '#B32800',
    accentLight: '#FCEAE5',
    ingredients: [
      ['1kg','Beef mince (12% works better than 5% here)'],
      ['2','Onions, diced'],
      ['6 cloves','Garlic, crushed'],
      ['250g','Chestnut mushrooms, roughly chopped'],
      ['2','Courgettes, diced'],
      ['2 tbsp','Vegetable oil'],
      ['2 tbsp','Cumin (ground)'],
      ['1 tbsp','Paprika (smoked)'],
      ['2 tsp','Chilli powder'],
      ['2 tsp','Coriander (ground)'],
      ['1 tsp','Cinnamon (ground)'],
      ['2 tsp','Oregano (dried)'],
      ['2 tbsp','Chipotle paste'],
      ['2 tbsp','Tomato purée'],
      ['2 tins (800g)','Chopped tomatoes'],
      ['2 tins','Kidney beans, drained'],
      ['400ml','Beef stock'],
      ['2','Bay leaves'],
      ['1 tbsp','Red wine vinegar'],
      ['2 tsp','Sea salt'],
      ['1 tsp','Black pepper'],
      ['300g','Basmati rice (tonight only)'],
      ['2','Avocados, sliced'],
      ['300g','Cherry tomatoes, halved'],
      ['1','Red onion, finely sliced'],
      ['2','Limes'],
      ['','Fresh coriander, chopped'],
      ['200ml','Soured cream'],
    ],
    steps: [
      ['8 min','Brown the mince properly',[
        'Big heavy pan, high heat, <strong>1 tbsp vegetable oil</strong>. Add <strong>500g of the beef mince</strong> — half only — and leave it to sit and brown for 3–4 min before breaking it up.',
        'Tip it out, repeat with the <strong>remaining 500g mince</strong>. Crowding the pan is what makes grey, boiled mince.',
      ]],
      ['8 min','Base',[
        'Same pan, <strong>1 tbsp vegetable oil</strong>. Fry <strong>2 diced onions</strong> with a pinch of salt, 6 min until soft and going golden at the edges.',
        'Add <strong>250g chopped mushrooms</strong>, fry 3 min until they release their water and it cooks off.',
        'Add <strong>6 cloves crushed garlic</strong>, 45 sec.',
      ]],
      ['2 min','Bloom the spices',[
        'Push the veg to one side, add a splash more oil, and tip in <strong>2 tbsp ground cumin + 1 tbsp smoked paprika + 2 tsp chilli powder + 2 tsp ground coriander + 1 tsp cinnamon + 2 tsp dried oregano</strong>.',
        'Stir in the hot oil for 45–60 sec until fragrant, then mix through the veg. Do not let them scorch.',
        'Add <strong>2 tbsp tomato purée + 2 tbsp chipotle paste</strong>, fry 1 min until the purée darkens.',
      ]],
      ['45 min','Simmer',[
        'Return all the mince. Add <strong>2 tins chopped tomatoes + 400ml beef stock + 2 bay leaves + 2 tsp sea salt + 1 tsp black pepper</strong>.',
        'Bring to a simmer, lid slightly ajar, 30 min. Stir now and then.',
        'Add <strong>2 diced courgettes + 2 drained tins kidney beans</strong>, simmer a further 15 min uncovered until thick enough that a spoon leaves a trail.',
        'Off the heat, stir in <strong>1 tbsp red wine vinegar</strong> and taste. It should be deep and slightly sweet with a low warm heat. More salt if it tastes flat.',
      ]],
      ['15 min','Rice and salad',[
        'Rice cooker on with <strong>300g basmati</strong>.',
        'Toss <strong>300g halved cherry tomatoes + 1 sliced red onion + 2 sliced avocados</strong> with the <strong>juice of 1 lime</strong>, a pinch of salt and chopped coriander.',
      ]],
      ['Serve','Plate up',[
        'Rice, chilli, a spoon of soured cream, salad on the side, extra lime wedges.',
        'Cool the remaining half quickly and fridge it for Monday.',
      ]],
    ],
    tip: 'The vinegar at the end is the difference between a decent chilli and a good one — it lifts everything and stops the spices tasting muddy. Cinnamon sounds odd here but it is doing the heavy lifting on depth.',
    prep: [
      'This is batch cook #1. Half goes in the fridge for Monday night — it will taste better on day two.',
      'Also makes excellent lunches. If you want extra, it freezes well in portions.',

  },
  {
    day: 'Sunday', shortDay: 'SUN', date: '23 Aug',
    name: 'Peri-Peri Chicken Thighs',
    subtitle: 'Air-Fryer Crispy Potatoes & Dressed Salad',
    cuisine: 'Portuguese', serves: '3', time: '30 min (+ marinade)', method: 'Air fryer',

    accent: '#D62828',
    accentLight: '#FDEBEB',
    ingredients: [
      ['800g','Chicken thighs, boneless & skinless'],
      ['4','Red chillies, roughly chopped (2 for milder)'],
      ['4 cloves','Garlic, peeled'],
      ['1 tbsp','Paprika (smoked)'],
      ['1 tsp','Paprika (sweet)'],
      ['1 tsp','Cayenne pepper'],
      ['2 tsp','Oregano (dried)'],
      ['1 tsp','Garlic granules'],
      ['2 tbsp','Red wine vinegar'],
      ['1','Lemon, juiced (plus 1 to serve)'],

      ['1½ tsp','Sea salt'],
      ['1kg','Maris Piper potatoes, cut into 3cm chunks'],

      ['','Mixed salad leaves, cucumber, cherry tomatoes, red onion'],
      ['1 tbsp','Balsamic vinegar'],
      ['2 tbsp','Extra virgin olive oil'],
    ],
    steps: [
      ['5 min','Blitz the marinade — do this in the morning',[
        'Blend <strong>4 red chillies + 4 cloves garlic + 1 tbsp smoked paprika + 1 tsp sweet paprika + 1 tsp cayenne + 2 tsp dried oregano + 1 tsp garlic granules + 2 tbsp red wine vinegar + juice of 1 lemon + 3 tbsp olive oil + 1½ tsp sea salt</strong> to a loose paste.',
        'Coat the <strong>800g chicken thighs</strong> and fridge. 4 hours minimum, all day is better.',
      ]],
      ['12 min','Parboil the potatoes',[
        'Boil the <strong>1kg potato chunks</strong> in well-salted water for 8 min from cold — a knife should go in with slight resistance.',
        'Drain, leave 2 min to steam dry, then shake them hard in the colander so the outsides go fluffy and rough. This is what makes them crisp.',

      ['25 min','Air fry the potatoes',[
        'Toss the roughed-up potatoes with <strong>2 tbsp vegetable oil + 1 tsp sea salt</strong>.',
        'Air fry at <strong>200°C for 22–25 min</strong>, shaking the basket twice, until deep golden. Tip into a warm bowl.',

      ['16 min','Air fry the chicken',[
        'Chicken into the air fryer in a single layer, <strong>190°C for 15–18 min</strong>, flipping at the halfway point.',

      ['3 min','Salad',[
        'Whisk <strong>1 tbsp balsamic vinegar + 2 tbsp extra virgin olive oil</strong> with a pinch of salt and pepper.',

      ['Serve','Plate up',[
        'Chicken, potatoes, salad, extra lemon to squeeze over the chicken at the table.',

      'Get the marinade on in the morning. This dish is largely made or broken by marinating time.',
      'Leftover chicken is excellent cold in a flatbread with yogurt for lunch.',
    ],
  },
  {
    day: 'Monday', shortDay: 'MON', date: '24 Aug',
    name: 'Loaded Chilli Jacket Potatoes',
    subtitle: 'Saturday’s Chilli, Air-Fryer Jackets, Cheddar & Soured Cream',
    cuisine: 'Mexican', serves: '3', time: '15 min active', method: 'Air fryer + reheat',

  tab.addEventListener('click', () => switchTo(idx));

function switchTo(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function togglePrep(toggle) {
  const body = toggle.nextElementSibling;
  const chevron = toggle.querySelector('.prep-chevron');
  toggle.classList.toggle('open');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}
